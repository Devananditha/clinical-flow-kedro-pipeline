[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical_flow"
version = "0.1.0"
description = "Production Kedro pipeline for clinical flow and hospital surge modeling"
readme = "README.md"
requires-python = ">=3.10"

[tool.kedro]
package_name = "clinical_flow"
project_name = "clinical_flow"
kedro_init_version = "0.19.6"

[tool.pyright]
include = ["src", "tests", "scripts", "run_pipeline.py", "setup_data.py"]
extraPaths = ["src", "."]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
